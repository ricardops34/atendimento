version: '3.8'

services:
  saas-api:
    image: bjsoftware/saas-api:latest
    networks:
      - network_db
      - network_public
    environment:
      # O host foi corrigido de db_bjsoft para postgres
      - DATABASE_URL=postgresql://saas_control:Saas%231256c0ntrol@postgres:5432/saas-sistema?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://redis:6379
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.saas-api.rule=Host(`api.sistema.bjsoft.com.br`)"
      - "traefik.http.services.saas-api.loadbalancer.server.port=3000"

  saas-web:
    image: bjsoftware/saas-web:latest
    networks:
      - network_public
    deploy:
      replicas: 1
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.saas-web.rule=Host(`sistema.bjsoft.com.br`) || HostRegexp(`{subdomain:[a-z0-9]+}.sistema.bjsoft.com.br`)"
      - "traefik.http.services.saas-web.loadbalancer.server.port=80"

networks:
  network_db:
    external: true
  network_public:
    external: true
