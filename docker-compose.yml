version: '3.8'

services:
  db_master:
    image: postgres:16-alpine
    container_name: saas_master
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: master_password
      POSTGRES_DB: saas_control
    ports:
      - "5431:5432"
    volumes:
      - pgdata_master:/var/lib/postgresql/data

  db_shared:
    image: postgres:16-alpine
    container_name: saas_shared
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: shared_password
      POSTGRES_DB: saas_pool
    ports:
      - "5432:5432"
    volumes:
      - pgdata_shared:/var/lib/postgresql/data

  db_logs:
    image: postgres:16-alpine
    container_name: saas_logs
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: logs_password
      POSTGRES_DB: saas_audit
    ports:
      - "5433:5432"
    volumes:
      - pgdata_logs:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: saas_cache
    restart: always
    ports:
      - "6379:6379"

  # jsreport: O motor de relatórios profissionais (PDF/Excel)
  jsreport:
    image: jsreport/jsreport:4.3.0-full
    container_name: saas_reports
    restart: always
    ports:
      - "5488:5488"
    environment:
      - trustUserCode=true

volumes:
  pgdata_master:
  pgdata_shared:
  pgdata_logs:
