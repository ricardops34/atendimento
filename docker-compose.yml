version: '3.8'

services:
  # Bancos de Dados
  db_master:
    image: postgres:16-alpine
    container_name: saas_master
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: master_password
      POSTGRES_DB: saas_control
    ports:
      - "5431:5432"
    volumes:
      - pgdata_master:/var/lib/postgresql/data

  db_shared:
    image: postgres:16-alpine
    container_name: saas_shared
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: shared_password
      POSTGRES_DB: saas_pool
    ports:
      - "5432:5432"
    volumes:
      - pgdata_shared:/var/lib/postgresql/data

  db_logs:
    image: postgres:16-alpine
    container_name: saas_logs
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: logs_password
      POSTGRES_DB: saas_audit
    ports:
      - "5433:5432"
    volumes:
      - pgdata_logs:/var/lib/postgresql/data

  # Cache e Filas
  redis:
    image: redis:7-alpine
    container_name: saas_cache
    restart: always
    ports:
      - "6379:6379"

  # Motor de Relatórios
  jsreport:
    image: jsreport/jsreport:4.3.0-full
    container_name: saas_reports
    restart: always
    ports:
      - "5488:5488"
    environment:
      - trustUserCode=true

  # Backend (API)
  api:
    build: 
      context: ./api
      dockerfile: Dockerfile
    container_name: saas_api
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://admin:master_password@db_master:5432/saas_control
      - REDIS_HOST=redis
    depends_on:
      - db_master
      - redis

  # Frontend (Web)
  web:
    build: 
      context: ./web
      dockerfile: Dockerfile
    container_name: saas_web
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pgdata_master:
  pgdata_shared:
  pgdata_logs:
