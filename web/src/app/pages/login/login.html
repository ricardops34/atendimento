<div class="login-wrapper">
  <div class="login-card">
    <!-- Logo Centralizada e Grande -->
    <div class="login-header-centered">
      <img [src]="logo" alt="Logo" class="login-logo-large" *ngIf="logo">
    </div>

    <form (submit)="loginSubmit()">
      <!-- Usuário -->
      <po-input 
        name="email" 
        [(ngModel)]="userEmail" 
        p-label="Usuário" 
        p-placeholder="Digite seu usuário"
        p-required>
      </po-input>

      <!-- Senha -->
      <po-password 
        name="password" 
        [(ngModel)]="userPassword" 
        p-label="Senha"
        p-placeholder="Digite sua senha" 
        p-required>
      </po-password>

      <!-- Esqueci minha senha -->
      <div class="recovery-container">
        <a (click)="forgotPassword()" class="forgot-password-link">Esqueci minha senha</a>
      </div>

      <!-- Botão Entrar (Tamanho Padrão) -->
      <div class="button-container">
        <po-button 
          p-label="Entrar" 
          p-kind="primary" 
          [p-loading]="loading"
          (p-click)="loginSubmit()">
        </po-button>
      </div>

      <!-- Manter conectado -->
      <div class="remember-container">
        <po-checkbox 
          name="remember" 
          [(ngModel)]="rememberMe" 
          p-label="Manter-me conectado">
        </po-checkbox>
      </div>
    </form>
  </div>
</div>
