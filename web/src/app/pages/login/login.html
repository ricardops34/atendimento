<div class="login-container">
  <!-- Card de Login Centralizado -->
  <div class="login-box">
    <div class="login-header">
      <img [src]="logo" alt="Logo" class="login-logo-brand">
    </div>

    <form #loginForm="ngForm" class="login-form">
      <!-- Campo Usuário -->
      <div class="field-group">
        <label class="field-label">Usuário</label>
        <po-input 
          name="email" 
          [(ngModel)]="userEmail" 
          p-placeholder="Digite seu usuário"
          p-required>
        </po-input>
      </div>

      <!-- Campo Senha -->
      <div class="field-group">
        <label class="field-label">Senha</label>
        <po-password 
          name="password" 
          [(ngModel)]="userPassword" 
          p-placeholder="Digite sua senha"
          p-required>
        </po-password>
      </div>

      <div class="forgot-link">
        <a (click)="forgotPassword()">Esqueci minha senha</a>
      </div>

      <!-- Botão Entrar Largo -->
      <div class="submit-container">
        <po-button 
          p-label="Entrar" 
          p-kind="primary" 
          [p-loading]="loading"
          (p-click)="loginSubmit()"
          class="btn-login-full">
        </po-button>
      </div>

      <!-- Manter conectado -->
      <div class="keep-connected">
        <po-checkbox 
          name="remember" 
          [(ngModel)]="rememberMe" 
          p-label="Manter-me conectado">
        </po-checkbox>
      </div>
    </form>
  </div>

  <!-- Seletor de Idioma no Canto Inferior Esquerdo -->
  <div class="footer-language">
    <po-select
      name="language"
      [p-options]="languageOptions"
      [ngModel]="selectedLanguage"
      (ngModelChange)="changeLanguage($event)"
      p-icon="po-icon-world">
    </po-select>
  </div>
</div>
