<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <img [src]="logo" alt="Logo" class="login-logo" *ngIf="logo">
      <h1 class="login-title">{{ welcome }}</h1>
      <p class="login-description" *ngIf="productName">{{ productName }}</p>
    </div>

    <form (submit)="loginSubmit()">
      <!-- Usuário -->
      <po-input 
        name="email" 
        [(ngModel)]="userEmail" 
        p-label="Usuário" 
        p-placeholder="Digite seu usuário"
        p-required>
      </po-input>

      <!-- Senha -->
      <po-password 
        name="password" 
        [(ngModel)]="userPassword" 
        p-label="Senha"
        p-placeholder="Digite sua senha" 
        p-required>
      </po-password>

      <!-- Esqueci minha senha (acima do botão, à direita) -->
      <div class="recovery-container">
        <a (click)="forgotPassword()" class="forgot-password-link">Esqueci minha senha</a>
      </div>

      <!-- Botão Entrar -->
      <po-button 
        class="login-button" 
        p-label="Entrar" 
        p-kind="primary" 
        [p-loading]="loading"
        (p-click)="loginSubmit()">
      </po-button>

      <!-- Manter conectado (abaixo do botão) -->
      <div class="remember-container">
        <po-checkbox 
          name="remember" 
          [(ngModel)]="rememberMe" 
          p-label="Manter-me conectado">
        </po-checkbox>
      </div>
    </form>
  </div>
</div>
