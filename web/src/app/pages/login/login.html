<div class="login-wrapper">
  <!-- Fundo com Overlay -->
  <div class="login-background" [style.backgroundImage]="'url(assets/images/' + background + ')'"></div>
  <div class="login-overlay"></div>

  <!-- Card de Login -->
  <div class="login-card">
    <div class="login-header">
      <img [src]="logo" alt="Logo" class="login-logo">
      <h1>{{ productName }}</h1>
      <p>{{ welcome }}</p>
    </div>

    <!-- Seletor de Idioma -->
    <div class="language-selector po-mb-2">
      <po-select
        name="language"
        [p-options]="languageOptions"
        [ngModel]="selectedLanguage"
        (ngModelChange)="changeLanguage($event)"
        p-icon="po-icon-world">
      </po-select>
    </div>

    <form #loginForm="ngForm">
      <!-- Campo E-mail -->
      <div class="input-container">
        <po-input 
          name="email" 
          [(ngModel)]="userEmail" 
          [p-label]="literals.email" 
          p-icon="po-icon-user"
          p-required>
        </po-input>
      </div>

      <!-- Campo Senha -->
      <div class="input-container">
        <po-password 
          name="password" 
          [(ngModel)]="userPassword" 
          [p-label]="literals.password"
          p-required>
        </po-password>
      </div>

      <div class="action-container">
        <a (click)="forgotPassword()">{{ literals.forgotPassword }}</a>
      </div>

      <!-- Botão Entrar -->
      <div class="button-container">
        <po-button 
          [p-label]="literals.enter" 
          p-kind="primary" 
          [p-loading]="loading"
          (p-click)="loginSubmit()">
        </po-button>
      </div>

      <!-- Manter conectado -->
      <div class="remember-container">
        <po-checkbox 
          name="remember" 
          [(ngModel)]="rememberMe" 
          [p-label]="literals.rememberMe">
        </po-checkbox>
      </div>
    </form>
  </div>
</div>
