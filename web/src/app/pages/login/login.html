<div class="login-container">
  <!-- Card de Login Centralizado -->
  <div class="login-box">
    <div class="login-header">
      <img [src]="logo" alt="Logo" class="login-logo-brand">
    </div>

    <form #loginForm="ngForm" class="login-form">
      <!-- Campo Usuário -->
      <div class="field-group">
        <label class="field-label">{{ literals.user }}</label>
        <po-input name="email" [(ngModel)]="userEmail" p-icon="an an-user" [p-placeholder]="literals.userPlaceholder"
          p-required>
        </po-input>
      </div>

      <!-- Campo Senha -->
      <div class="field-group">
        <label class="field-label">{{ literals.password }}</label>
        <po-password name="password" [(ngModel)]="userPassword" [p-placeholder]="literals.passwordPlaceholder"
          p-required>
        </po-password>
      </div>

      <div class="forgot-link">
        <a (click)="forgotPassword()">{{ literals.forgotPassword }}</a>
      </div>

      <!-- Botão Entrar Largo -->
      <div class="submit-container">
        <po-button class="po-sm-12" p-kind="primary" [p-label]="literals?.enter" [p-loading]="loading"
          (p-click)="loginSubmit()" class="po-button-block">
        </po-button>
      </div>

      <!-- Manter conectado -->
      <div class="keep-connected">
        <po-checkbox class="po-sm-12" name="remember" [(ngModel)]="rememberMe" [p-label]="literals.rememberMe">
        </po-checkbox>
      </div>
    </form>
  </div>

  <!-- Seletor de Idioma no Canto Inferior Esquerdo -->
  <div class="footer-language">
    <po-select name="language" [p-options]="languageOptions" [ngModel]="selectedLanguage"
      (ngModelChange)="changeLanguage($event)" p-icon="po-icon-world">
    </po-select>
  </div>
</div>
