<div class="login-container">
  <!-- Card de Login Centralizado -->
  <div class="login-box">
    <div class="login-header">
      <img [src]="logo" alt="Logo" class="login-logo-brand">
    </div>

    <form #loginForm="ngForm" class="login-form">
      <!-- Campo Usuário -->
      <div class="po-row">
        <po-input name="email" class="po-md-12" [(ngModel)]="userEmail" p-icon="an an-user" 
          [p-label]="literals.user" [p-placeholder]="literals.userPlaceholder" p-required>
        </po-input>
      </div>

      <!-- Campo Senha -->
      <div class="po-row">
        <po-password name="password" class="po-md-12" [(ngModel)]="userPassword" 
          [p-label]="literals.password" [p-placeholder]="literals.passwordPlaceholder" p-required>
        </po-password>
      </div>

      <div class="po-row">
        <div class="po-md-12 forgot-link">
          <a (click)="forgotPassword()">{{ literals.forgotPassword }}</a>
        </div>
      </div>

      <!-- Botão Entrar -->
      <div class="po-row">
        <po-button class="po-md-12" [p-label]="literals?.enter" p-kind="primary" (p-click)="loginSubmit()">
        </po-button>
      </div>

      <!-- Manter conectado -->
      <div class="po-row">
        <po-checkbox class="po-md-12" name="remember" [(ngModel)]="rememberMe" [p-label]="literals.rememberMe">
        </po-checkbox>
      </div>
    </form>
  </div>

  <!-- Seletor de Idioma no Canto Inferior Esquerdo -->
  <div class="footer-language">
    <po-select name="language" [p-options]="languageOptions" [ngModel]="selectedLanguage"
      (ngModelChange)="changeLanguage($event)" p-icon="an an-globe">
    </po-select>
  </div>
</div>
