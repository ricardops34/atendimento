<div class="login-wrapper">
  <div class="login-card">
    <!-- Logo Centralizada -->
    <div class="login-header-centered">
      <img [src]="logo" alt="Logo" class="login-logo-large" *ngIf="logo">
    </div>

    <form (submit)="loginSubmit()">
      <!-- Usuário -->
      <po-input 
        name="email" 
        [(ngModel)]="userEmail" 
        [p-label]="literals.user" 
        [p-placeholder]="literals.userPlaceholder"
        p-required>
      </po-input>

      <!-- Senha -->
      <po-password 
        name="password" 
        [(ngModel)]="userPassword" 
        [p-label]="literals.password"
        [p-placeholder]="literals.passwordPlaceholder" 
        p-required>
      </po-password>

      <!-- Esqueci minha senha -->
      <div class="recovery-container">
        <a (click)="forgotPassword()" class="forgot-password-link">{{ literals.forgotPassword }}</a>
      </div>

      <!-- Botão Entrar -->
      <div class="button-container">
        <po-button 
          [p-label]="literals.enter" 
          p-kind="primary" 
          [p-loading]="loading"
          (p-click)="loginSubmit()">
        </po-button>
      </div>

      <!-- Manter conectado -->
      <div class="remember-container">
        <po-checkbox 
          name="remember" 
          [(ngModel)]="rememberMe" 
          [p-label]="literals.rememberMe">
        </po-checkbox>
      </div>
    </form>
  </div>
</div>
