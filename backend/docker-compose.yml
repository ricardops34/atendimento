version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: atendimento_mvp_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-atendimento_mvp}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  legacy_db:
    image: mysql:8.0
    container_name: atendimento_legacy_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bjsoft18_portal
    ports:
      - "3306:3306"
    volumes:
      - ../antigo/backup/bjsoft18_portal.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: atendimento_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    restart: unless-stopped
volumes:
  postgres_data:
