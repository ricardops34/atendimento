<po-page-login
  [p-hide-remember-user]="true"
  [p-login-pattern]="'^[^@]+@[^@]+\\.[a-zA-Z]{2,}$'"
  [p-custom-field]="customField"
  p-background="/bg_login_generated.png"
  p-logo="/logo_bj.png"
  p-secondary-logo="/logo_bj.png"
  (p-change-login)="onEmailChange($event)"
  (p-login-submit)="loginSubmit($event)">
</po-page-login>
