<po-page-list p-title="CEPs" [p-disclaimer-group]="disclaimerGroup">
  <div class="po-row" style="align-items: end; margin-bottom: 16px; row-gap: 12px;">
    <div class="po-md-6 po-sm-12">
      <po-button p-label="Novo CEP (Manual)" p-icon="po-icon-plus" (p-click)="openCreate()"></po-button>
    </div>
    <div class="po-md-6 po-sm-12" style="display: flex; justify-content: flex-end; align-items: center; gap: 12px; flex-wrap: wrap;">
      <div style="display: flex; gap: 8px; align-items: end;">
        <po-input p-label="Buscar ViaCEP" p-placeholder="00000000" [(ngModel)]="searchCepStr" style="width: 150px;"></po-input>
        <po-button p-icon="po-icon-search" p-kind="secondary" (p-click)="searchViaCep()"></po-button>
      </div>
      <div style="min-width: 250px; width: 250px; max-width: 100%;">
        <po-search p-placeholder="Pesquisar localmente" [(ngModel)]="quickSearch" (p-filter)="onQuickSearch($event)" (p-change-model)="quickSearch = $event"></po-search>
      </div>
    </div>
  </div>
  <po-table [p-items]="items" [p-columns]="columns" [p-actions]="actions" [p-loading]="loading" [p-loading-show-more]="loadingShowMore" [p-show-more-disabled]="!hasNext" [p-sort]="true" [p-hide-detail]="true" [p-hide-table-search]="true" (p-show-more)="onShowMore()" (p-sort-by)="onSortChange($event)"></po-table>
</po-page-list>
<po-modal p-title="CEP (Edição Manual)" #modal>
  <div class="po-row">
    <po-input class="po-md-4" p-label="CEP" [ngModel]="formData.cep" (ngModelChange)="formData.cep = $event" [p-disabled]="isEdit ? 'true' : 'false'"></po-input>
    <po-input class="po-md-8" p-label="Logradouro" [ngModel]="formData.logradouro" (ngModelChange)="formData.logradouro = $event"></po-input>
  </div>
  <div class="po-row">
    <po-input class="po-md-4" p-label="Bairro" [ngModel]="formData.bairro" (ngModelChange)="formData.bairro = $event"></po-input>
    <po-number class="po-md-4" p-label="Cód. IBGE Mun." [ngModel]="formData.municipioId" (ngModelChange)="formData.municipioId = $event"></po-number>
    <po-number class="po-md-4" p-label="Cód. IBGE Est." [ngModel]="formData.estadoId" (ngModelChange)="formData.estadoId = $event"></po-number>
  </div>
  <po-modal-footer><po-button p-label="Salvar" p-kind="primary" [p-loading]="saving" (p-click)="save()"></po-button></po-modal-footer>
</po-modal>
