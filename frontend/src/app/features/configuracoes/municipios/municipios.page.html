<po-page-list p-title="Municípios" [p-disclaimer-group]="disclaimerGroup">
  <div class="po-row" style="align-items: end; margin-bottom: 16px; row-gap: 12px;">
    <div class="po-md-6 po-sm-12"><po-button p-label="Novo Município" p-icon="po-icon-plus" (p-click)="openCreate()"></po-button></div>
    <div class="po-md-6 po-sm-12" style="display: flex; justify-content: flex-end; align-items: center; gap: 12px; flex-wrap: wrap;">
      <div style="min-width: 280px; width: 280px; max-width: 100%;"><po-search p-placeholder="Pesquisar" [(ngModel)]="quickSearch" (p-filter)="onQuickSearch($event)" (p-change-model)="quickSearch = $event"></po-search></div>
      <po-button p-label="Busca avançada" p-kind="tertiary" (p-click)="openAdvancedFilters()"></po-button>
    </div>
  </div>
  <po-table [p-items]="items" [p-columns]="columns" [p-actions]="actions" [p-loading]="loading" [p-loading-show-more]="loadingShowMore" [p-show-more-disabled]="!hasNext" [p-sort]="true" [p-hide-detail]="true" [p-hide-table-search]="true" (p-show-more)="onShowMore()" (p-sort-by)="onSortChange($event)"></po-table>
</po-page-list>
<po-modal p-title="Busca avançada" #advancedFilterModal>
  <div class="po-row">
    <po-combo class="po-md-12" p-label="Estado" [ngModel]="filters.estadoId" (ngModelChange)="filters.estadoId = $event" [p-options]="estadosOptions"></po-combo>
  </div>
  <po-modal-footer>
    <po-button p-label="Limpar" (p-click)="clearFilters()"></po-button>
    <po-button p-label="Aplicar filtros" p-kind="primary" (p-click)="applyAdvancedFilters()"></po-button>
  </po-modal-footer>
</po-modal>
<po-modal p-title="Município" #modal>
  <div class="po-row">
    <po-number class="po-md-4" p-label="Código IBGE" [ngModel]="formData.id" (ngModelChange)="formData.id = $event" [p-disabled]="isEdit ? 'true' : 'false'"></po-number>
    <po-input class="po-md-8" p-label="Nome" [ngModel]="formData.nome" (ngModelChange)="formData.nome = $event"></po-input>
  </div>
  <div class="po-row">
    <po-combo class="po-md-12" p-label="Estado" [ngModel]="formData.estadoId" (ngModelChange)="formData.estadoId = $event" [p-options]="estadosOptions"></po-combo>
  </div>
  <po-modal-footer><po-button p-label="Salvar" p-kind="primary" [p-loading]="saving" (p-click)="save()"></po-button></po-modal-footer>
</po-modal>
