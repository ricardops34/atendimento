<po-page-list p-title="Usuarios" [p-disclaimer-group]="disclaimerGroup">
  <div class="po-row" style="align-items: end; margin-bottom: 16px; row-gap: 12px;">
    <div class="po-md-6 po-sm-12"><po-button p-label="Novo Usuario" p-icon="an an-plus" (p-click)="openCreate()"></po-button></div>
    <div class="po-md-6 po-sm-12" style="display: flex; justify-content: flex-end; align-items: center; gap: 12px; flex-wrap: wrap;">
      <div style="min-width: 280px; width: 280px; max-width: 100%;"><po-search p-placeholder="Pesquisar" [(ngModel)]="quickSearch" (p-filter)="onQuickSearch($event)" (p-change-model)="quickSearch = $event"></po-search></div>
      <po-button p-label="Busca avancada" p-kind="tertiary" (p-click)="openAdvancedFilters()"></po-button>
    </div>
  </div>

  <po-table
    [p-items]="items"
    [p-columns]="columns"
    [p-actions]="actions"
    [p-loading]="loading"
    [p-loading-show-more]="loadingShowMore"
    [p-show-more-disabled]="!hasNext"
    [p-sort]="true"
    [p-hide-detail]="true"
    [p-hide-table-search]="true"
    (p-show-more)="onShowMore()"
    (p-sort-by)="onSortChange($event)">
  </po-table>
</po-page-list>

<po-modal p-title="Busca avancada" #advancedFilterModal>
  <div class="po-row">
    <po-combo class="po-md-4" p-label="Empresa" [p-options]="tenantOptions" [ngModel]="filters.tenantId" (ngModelChange)="filters.tenantId = $event"></po-combo>
    <po-combo class="po-md-4" p-label="Perfil" [p-options]="profileOptions" [ngModel]="filters.profileId" (ngModelChange)="filters.profileId = $event"></po-combo>
    <po-combo class="po-md-4" p-label="Status" [p-options]="activeOptions" [ngModel]="filters.isActive" (ngModelChange)="filters.isActive = $event"></po-combo>
  </div>
  <div class="po-row">
    <po-input class="po-md-6" p-label="Usuario" [ngModel]="filters.name" (ngModelChange)="filters.name = $event"></po-input>
    <po-input class="po-md-6" p-label="Email" [ngModel]="filters.email" (ngModelChange)="filters.email = $event"></po-input>
  </div>
  <po-modal-footer>
    <po-button p-label="Limpar" (p-click)="clearFilters()"></po-button>
    <po-button p-label="Aplicar filtros" p-kind="primary" (p-click)="applyAdvancedFilters()"></po-button>
  </po-modal-footer>
</po-modal>

<po-modal p-title="Usuario" #modal>
  <div class="po-row">
    <po-switch class="po-md-4" p-label="Ativo" [ngModel]="formData.isActive" (ngModelChange)="formData.isActive = $event"></po-switch>
  </div>
  <div class="po-row">
    <po-input class="po-md-6" p-label="Nome" [ngModel]="formData.name" (ngModelChange)="formData.name = $event"></po-input>
    <po-email class="po-md-6" p-label="Email" [ngModel]="formData.email" (ngModelChange)="formData.email = $event"></po-email>
  </div>
  <div class="po-row">
    <po-password class="po-md-6" p-label="Senha" [ngModel]="formData.password" (ngModelChange)="formData.password = $event"></po-password>
    <po-combo class="po-md-6" p-label="Perfil" [p-options]="profileOptions" [ngModel]="formData.profileId" (ngModelChange)="formData.profileId = $event"></po-combo>
  </div>

  <div class="po-row">
    <po-combo class="po-md-10" p-label="Empresa" [p-options]="tenantOptions" [ngModel]="formData.selectedTenantId" (ngModelChange)="formData.selectedTenantId = $event"></po-combo>
    <div class="po-md-2" style="display: flex; align-items: end;">
      <po-button p-label="Adicionar" p-kind="tertiary" (p-click)="addTenantLink()"></po-button>
    </div>
  </div>

  <div class="po-row" *ngFor="let link of formData.tenantLinks; let index = index" style="align-items: center; margin-bottom: 8px;">
    <div class="po-md-10">{{ resolveTenantName(link.tenantId) }}</div>
    <div class="po-md-1">{{ link.isDefault ? 'Padrao' : '' }}</div>
    <div class="po-md-1"><po-button p-label="X" p-kind="tertiary" (p-click)="removeTenantLink(index)"></po-button></div>
    <div class="po-md-12" *ngIf="!link.isDefault" style="margin-top: 4px;">
      <po-button p-label="Definir como padrao" p-kind="tertiary" (p-click)="setDefaultTenant(index)"></po-button>
    </div>
  </div>

  <po-modal-footer>
    <po-button p-label="Salvar" p-kind="primary" [p-loading]="saving" (p-click)="save()"></po-button>
  </po-modal-footer>
</po-modal>
