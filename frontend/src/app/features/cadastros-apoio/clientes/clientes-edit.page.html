<po-page-edit [p-title]="title" (p-save)="save()" (p-cancel)="cancel()">
  <po-loading-overlay *ngIf="loading" p-text="Carregando..."></po-loading-overlay>

  <!-- Tipo de Pessoa -->
  <div class="po-row">
    <po-combo class="po-md-6" p-label="Tipo de Pessoa *" name="tipoPessoa"
      [p-options]="tipoPessoaOptions"
      [ngModel]="form.tipoPessoa" (ngModelChange)="form.tipoPessoa = $event">
    </po-combo>
    <po-input class="po-md-3" p-label="Cor na Agenda (hex)" name="cor"
      p-placeholder="#RRGGBB" [p-maxlength]="7"
      [ngModel]="form.cor" (ngModelChange)="form.cor = $event">
    </po-input>
  </div>

  <po-divider p-label="Identificação"></po-divider>

  <!-- Nome / Razão Social (PJ) -->
  <div class="po-row" *ngIf="isPJ">
    <po-input class="po-md-6" p-label="Nome Fantasia *" name="nome"
      [ngModel]="form.nome" (ngModelChange)="form.nome = $event">
    </po-input>
    <po-input class="po-md-6" p-label="Razão Social" name="razaoSocial"
      [ngModel]="form.razaoSocial" (ngModelChange)="form.razaoSocial = $event">
    </po-input>
  </div>
  <div class="po-row" *ngIf="isPJ">
    <po-input class="po-md-4" p-label="CNPJ" name="cnpj"
      p-placeholder="00.000.000/0000-00" [p-maxlength]="18"
      [ngModel]="form.cnpj" (ngModelChange)="form.cnpj = $event">
    </po-input>
    <po-input class="po-md-4" p-label="Inscrição Estadual" name="inscricaoEstadual"
      [p-maxlength]="20"
      [ngModel]="form.inscricaoEstadual" (ngModelChange)="form.inscricaoEstadual = $event">
    </po-input>
    <po-input class="po-md-4" p-label="Inscrição Municipal" name="inscricaoMunicipal"
      [p-maxlength]="20"
      [ngModel]="form.inscricaoMunicipal" (ngModelChange)="form.inscricaoMunicipal = $event">
    </po-input>
  </div>

  <!-- Nome / CPF / RG (PF) -->
  <div class="po-row" *ngIf="!isPJ">
    <po-input class="po-md-8" p-label="Nome Completo *" name="nome"
      [ngModel]="form.nome" (ngModelChange)="form.nome = $event">
    </po-input>
    <po-datepicker class="po-md-4" p-label="Data de Nascimento" name="dataNascimento"
      [ngModel]="form.dataNascimento" (ngModelChange)="form.dataNascimento = $event">
    </po-datepicker>
  </div>
  <div class="po-row" *ngIf="!isPJ">
    <po-input class="po-md-4" p-label="CPF" name="cpf"
      p-placeholder="000.000.000-00" [p-maxlength]="14"
      [ngModel]="form.cpf" (ngModelChange)="form.cpf = $event">
    </po-input>
    <po-input class="po-md-4" p-label="RG" name="rg"
      [p-maxlength]="20"
      [ngModel]="form.rg" (ngModelChange)="form.rg = $event">
    </po-input>
  </div>

  <po-divider p-label="Contato"></po-divider>

  <div class="po-row">
    <po-input class="po-md-4" p-label="Telefone / WhatsApp" name="telefone"
      p-placeholder="(00) 9 0000-0000" [p-maxlength]="20"
      [ngModel]="form.telefone" (ngModelChange)="form.telefone = $event">
    </po-input>
    <po-input class="po-md-4" p-label="Celular" name="celular"
      p-placeholder="(00) 9 0000-0000" [p-maxlength]="20"
      [ngModel]="form.celular" (ngModelChange)="form.celular = $event">
    </po-input>
    <po-email class="po-md-4" p-label="E-mail" name="email"
      [ngModel]="form.email" (ngModelChange)="form.email = $event">
    </po-email>
  </div>

  <po-divider p-label="Endereço"></po-divider>

  <div class="po-row" style="align-items: flex-end;">
    <po-input class="po-md-3" p-label="CEP" name="cep"
      p-placeholder="00000-000" [p-maxlength]="9"
      [ngModel]="form.cep" (ngModelChange)="form.cep = $event">
    </po-input>
    <div class="po-md-2" style="padding-bottom: 8px;">
      <po-button p-label="Buscar CEP" p-icon="po-icon-search"
        [p-loading]="buscandoCep" (p-click)="buscarCep()">
      </po-button>
    </div>
  </div>
  <div class="po-row">
    <po-input class="po-md-8" p-label="Logradouro" name="logradouro"
      [p-maxlength]="255"
      [ngModel]="form.logradouro" (ngModelChange)="form.logradouro = $event">
    </po-input>
    <po-input class="po-md-2" p-label="Número" name="numero"
      [p-maxlength]="10"
      [ngModel]="form.numero" (ngModelChange)="form.numero = $event">
    </po-input>
    <po-input class="po-md-2" p-label="Complemento" name="complemento"
      [p-maxlength]="100"
      [ngModel]="form.complemento" (ngModelChange)="form.complemento = $event">
    </po-input>
  </div>
  <div class="po-row">
    <po-input class="po-md-4" p-label="Bairro" name="bairro"
      [p-maxlength]="100"
      [ngModel]="form.bairro" (ngModelChange)="form.bairro = $event">
    </po-input>
    <po-combo class="po-md-3" p-label="UF" name="uf"
      [p-options]="estadoOptions"
      [ngModel]="form.uf" (ngModelChange)="form.uf = $event; onUfChange($event)">
    </po-combo>
    <po-combo class="po-md-5" p-label="Município" name="municipio"
      [p-options]="municipioOptions"
      [ngModel]="form.municipio" (ngModelChange)="form.municipio = $event">
    </po-combo>
  </div>
  <div class="po-row">
    <po-input class="po-md-4" p-label="País" name="pais"
      [p-maxlength]="50"
      [ngModel]="form.pais" (ngModelChange)="form.pais = $event">
    </po-input>
  </div>
</po-page-edit>
