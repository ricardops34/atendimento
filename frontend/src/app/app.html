<div class="po-wrapper" *ngIf="isAuthenticated()">
  <po-header
    [p-brand]="headerBrand"
    [p-actions-tools]="headerActionsTools"
    [p-header-user]="headerUser">
  </po-header>

  <po-menu  
    [p-collapsed]="true" 
    [p-filter]="true" 
    [p-automatic-toggle]="true" 
    [p-menus]="menus()"></po-menu>

  <div style="margin-top: 64px;">
    <div style="padding: 16px 16px 0 16px;" *ngIf="breadcrumb().items.length > 0">
      <po-breadcrumb [p-items]="breadcrumb().items" style="display: block;"></po-breadcrumb>
    </div>
    <router-outlet></router-outlet>
  </div>

  <po-modal p-title="Trocar empresa" #switchEmpresaModal>
    <div class="po-row">
      <po-combo
        class="po-md-12"
        p-label="Empresa"
        [p-options]="empresaOptions"
        [ngModel]="selectedEmpresaId"
        (ngModelChange)="selectedEmpresaId = $event">
      </po-combo>
    </div>
    <po-modal-footer>
      <po-button p-label="Confirmar" p-kind="primary" (p-click)="confirmSwitchEmpresa()"></po-button>
    </po-modal-footer>
  </po-modal>

  <po-modal p-title="Meu perfil" #profileModal>
    <div class="po-row">
      <div class="po-md-12" style="text-align: center; margin-bottom: 16px;">
        <img [src]="'/avatar/' + profileForm.avatar" alt="Avatar" style="width: 96px; height: 96px; border-radius: 50%; cursor: pointer; border: 3px solid var(--color-primary-light)" (click)="avatarModal.open()" title="Clique para alterar o avatar">
        <div style="margin-top: 8px;">
          <po-button p-label="Alterar Avatar" p-kind="tertiary" (p-click)="avatarModal.open()"></po-button>
        </div>
      </div>
    </div>
    <div class="po-row">
      <po-input class="po-md-6" p-label="Usuario" [ngModel]="profileForm.name" p-readonly="true"></po-input>
      <po-email class="po-md-6" p-label="Email" [ngModel]="profileForm.email" p-readonly="true"></po-email>
    </div>
    <div class="po-row">
      <po-input class="po-md-6" p-label="Empresa" [ngModel]="profileForm.empresaName" p-readonly="true"></po-input>
      <po-input class="po-md-6" p-label="Perfil" [ngModel]="profileForm.profileName" p-readonly="true"></po-input>
    </div>

    <div class="po-row">
      <po-password class="po-md-6" p-label="Nova senha" [ngModel]="profileForm.password" (ngModelChange)="profileForm.password = $event"></po-password>
      <po-password class="po-md-6" p-label="Confirmar senha" [ngModel]="profileForm.confirmPassword" (ngModelChange)="profileForm.confirmPassword = $event"></po-password>
    </div>
    <po-modal-footer>
      <po-button p-label="Salvar" p-kind="primary" (p-click)="saveProfile()"></po-button>
    </po-modal-footer>
  </po-modal>

  <po-modal p-title="Selecione um Avatar" #avatarModal>
    <div style="display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; max-height: 400px; overflow-y: auto; padding: 16px;">
      <img *ngFor="let option of avatarOptions" 
           [src]="'/avatar/' + option.value" 
           [alt]="option.label"
           (click)="profileForm.avatar = option.value; avatarModal.close()"
           style="width: 80px; height: 80px; border-radius: 50%; cursor: pointer; transition: transform 0.2s;"
           onmouseover="this.style.transform='scale(1.1)'"
           onmouseout="this.style.transform='scale(1)'"
           [style.border]="profileForm.avatar === option.value ? '4px solid var(--color-primary)' : '4px solid transparent'">
    </div>
  </po-modal>
</div>

<div *ngIf="!isAuthenticated()">
  <router-outlet></router-outlet>
</div>
