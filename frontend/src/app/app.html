<div class="po-wrapper" *ngIf="isAuthenticated()">
  <po-toolbar 
    p-title="Sistema de Atendimento"
    [p-profile]="profile"
    [p-profile-actions]="profileActions">
  </po-toolbar>

  <po-menu  
    [p-collapsed]="true" 
    [p-filter]="true" 
    [p-automatic-toggle]="true" 
    [p-menus]="menus()"></po-menu>

  <router-outlet></router-outlet>
</div>

<div *ngIf="!isAuthenticated()">
  <router-outlet></router-outlet>
</div>
